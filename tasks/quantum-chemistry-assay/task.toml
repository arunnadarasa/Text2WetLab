schema_version = "1.4"

[task]
name = "text2wetlab/quantum-chemistry-assay"
version = "0.1.0"
description = "Automated Opentrons OT-2 execution of a quantum-chemistry-derived synergistic enzyme inhibition assay"
authors = [{ name = "Text2WetLab Quantum Biology Initiative" }]
keywords = ["opentrons", "ot-2", "quantum-chemistry", "synergy-assay", "lab-automation", "pytket", "quantinuum"]

[metadata]
level = "easy"
vagueness = "V1"
steps = 6
containers = 3
source = "quantum-chemistry-synthesis"
deck = "specified"
grading = "simulator gate + 6-point robotics AST check + tip lifecycle discipline + concentration boundary verification"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 900.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}", OPENROUTER_API_KEY = "${OPENROUTER_API_KEY:-}", JUDGE_MODEL = "${JUDGE_MODEL:-}" }

[environment]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "openrouter.ai", "registry.npmjs.org"]
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0

[checks]
free_wells = ["plate"]
